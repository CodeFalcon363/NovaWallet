services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "NovaWallet_Dev_Pw1!"
    ports:
      - "1433:1433"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: src/api/NovaWallet
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_URLS: "http://+:8080"
      ConnectionStrings__NovaWalletDb: "Server=sqlserver,1433;Database=NovaWallet;User Id=sa;Password=NovaWallet_Dev_Pw1!;TrustServerCertificate=True;"
    depends_on:
      sqlserver:
        condition: service_healthy
